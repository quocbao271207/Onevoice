evidence_corrections:
  - artifact: data/reports/experiments/decoding/mt_val_greedy_rescored.json
    status: invalid_for_vinai_claim
    correct_model: facebook/nllb-200-distilled-600M
    reason: "Derived from the NLLB greedy predictions; no VinAI inference evidence exists in this artifact."

workflow:
  - current_pipeline_complete
  - freeze_candidate_a
  - mt_multi_model_bakeoff
  - asr_multi_model_bakeoff
  - full_train_selected_winners
  - blind_locked_test_v2
  - deployment_benchmark
  - promotion_or_reject
