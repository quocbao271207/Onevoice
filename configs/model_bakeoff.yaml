version: 1
decision_date: "2026-10-05"

principles:
  preserve_current_pipeline: true
  current_candidate_a_is_reference: true
  candidate_a_auto_promotion_forbidden: true
  compare_by_learned_samples_or_tokens_not_wall_time: true
  one_gpu_child_at_a_time: true
  blind_test_v2_open_once: true

prerequisite:
  current_program_state_glob: gpu-runs/program-*/program_state.json
  required_execution_status: complete
  freeze_candidate_a_before_bakeoff: true

resources:
  gpu_memory_fraction: 0.35
  gpu_memory_hard_fraction: 0.40
  utilization_percent: 70.0
  hard_utilization_percent: 74.0
  resume_percent: 55.0
  sample_seconds: 2.0
  rolling_samples: 10
  checkpoint_archive_poll_seconds: 15.0
  invariant: "All limits are below 75%; never run two GPU children concurrently."

data:
  train:
    mt: data/processed/manifests/mt--train.jsonl
    asr: data/processed/manifests/asr--train-local.jsonl
  selection_dev:
    mt:
      path: data/eval/mt_selection_dev.jsonl
      sha256: a073b05299128ed3131c8eb674c17e1b44e9d25ae1166c6b59feba5622d49f6c
    asr:
      path: data/eval/asr_selection_dev.jsonl
      sha256: c7ecfe79d9bdf00362b4d080b9e857fefca5c17326e1eb9885e4921d4bae018c
  blind_test_v2_lock: data/eval/blind_test_v2.lock.json
  forbidden_selection_inputs:
    - data/processed/manifests/mt--test.jsonl
    - data/processed/manifests/asr--test-local.jsonl
    - data/eval/medical_safety_mt.jsonl
    - data/eval/medical_safety_asr_vi.jsonl

successive_halving:
  seed: 20261005
  zero_shot:
    train_steps: 0
  pilot:
    train_steps: 400
    max_train_samples: 8192
  semifinal:
    train_steps: 2000
    keep: 2
  full:
    train_steps: -1
    eligibility: winner_or_overlapping_95ci
  comparison_unit: effective_train_samples
  bootstrap_repeats: 1000

promotion_gate:
  critical_failure_rate_max: 0.0
  critical_slices: [drug_name, dose, number, unit, negation]
  policy_slices: [terminology, code_switch]
  require_all_slices_nonempty: true
  require_better_than_candidate_a_beyond_95ci: true
  mt_metrics: [sacrebleu, chrf2]
  asr_metrics: [wer, cer, code_switch_wer]
  asr_code_switch_wer_max: 0.21
  deployment_metrics: [latency_p50_ms, latency_p95_ms, peak_ram_bytes, peak_vram_bytes, model_bytes]
  deployment_min_runs: 30

candidates:
  mt:
    - id: mt_nllb_600m_a
      role: candidate_a
      status: in_progress
      directions: [en_to_vi, vi_to_en]
      model: facebook/nllb-200-distilled-600M
      revision: f8d333a098d19b4fd9a8b18f94170487ad3f821d
      model_family: nllb
      license:
        id: cc-by-nc-4.0
        source: https://huggingface.co/facebook/nllb-200-distilled-600M
        review_status: approved_research_only
        production_eligible: false
        gpu_eligible: true
    - id: mt_vinai_en2vi_v2
      role: challenger
      status: planned
      directions: [en_to_vi]
      model: vinai/vinai-translate-en2vi-v2
      revision: 82f8c91bd22e82085186b45a8a76373f5a79f667
      model_family: mbart_directional
      license:
        id: agpl-3.0
        source: https://huggingface.co/vinai/vinai-translate-en2vi-v2
        review_status: legal_review_required
        production_eligible: false
        research_reference_allowed: true
        gpu_eligible: false
    - id: mt_vinai_vi2en_v2
      role: challenger
      status: planned
      directions: [vi_to_en]
      model: vinai/vinai-translate-vi2en-v2
      revision: ae7baa85da07dbe8e23ac26a9f5ef560c17e2138
      model_family: mbart_directional
      license:
        id: agpl-3.0
        source: https://huggingface.co/vinai/vinai-translate-vi2en-v2
        review_status: legal_review_required
        production_eligible: false
        research_reference_allowed: true
        gpu_eligible: false
    - id: mt_m2m100_418m
