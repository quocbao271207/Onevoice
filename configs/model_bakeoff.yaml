  deployment_reference:
    - id: qualcomm_whisper_small_quantized
      role: deployment_reference_only
      status: historical_evidence_available_current_catalog_recheck_required
      trainable: false
      model: Whisper-Small-Quantized
      quantization: w8a16
      upstream_model: openai/whisper-small
      target: Qualcomm QCS6490
      license:
        id: apache-2.0
        source: https://aihub.qualcomm.com/models/whisper_small_quantized
        review_status: approved
        production_eligible: true
        gpu_eligible: false
      current_catalog_observation:
        checked_at: "2026-10-05"
        qcs6490_listed: false
